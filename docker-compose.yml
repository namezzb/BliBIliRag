version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - BILIBILIRAG_APP_ENV=production
      - BILIBILIRAG_LOG_LEVEL=INFO
      - BILIBILIRAG_DATA_DIR=/app/data
      - BILIBILIRAG_SQLITE_PATH=/app/data/videos.db
      - BILIBILIRAG_CHROMA_PATH=/app/data/chroma
      - BILIBILIRAG_DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - BILIBILIRAG_COHERE_API_KEY=${COHERE_API_KEY:-}
    volumes:
      - ./data:/app/data
    networks:
      - bilibilirag
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bilibilirag

networks:
  bilibilirag:
    driver: bridge

volumes:
  data:
    driver: local
